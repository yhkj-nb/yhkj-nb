<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>链接已更新 · 请手动前往</title>
  <!-- 使用优雅的字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <style>
    /* 全局重置与基础风格 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(145deg, #f6f9fc 0%, #e9f2f9 100%);
      padding: 1.5rem;
      margin: 0;
      position: relative;
      overflow-x: hidden;
    }

    /* 装饰性光斑 */
    body::before {
      content: '';
      position: absolute;
      width: 80vmax;
      height: 80vmax;
      background: radial-gradient(circle at 30% 30%, rgba(168, 212, 255, 0.3), transparent 70%);
      top: -30vmax;
      left: -30vmax;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 70vmax;
      height: 70vmax;
      background: radial-gradient(circle at 70% 80%, rgba(187, 220, 255, 0.25), transparent 70%);
      bottom: -30vmax;
      right: -30vmax;
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    /* 主卡片 */
    .card {
      position: relative;
      z-index: 10;
      max-width: 540px;
      width: 100%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: 2.5rem;
      padding: 3rem 2.5rem 2.8rem;
      box-shadow: 
        0 25px 40px -12px rgba(0, 40, 80, 0.25),
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 0 0 1px rgba(210, 230, 255, 0.6);
      text-align: center;
      transition: all 0.2s ease;
      animation: cardAppear 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* SVG 图标区域 — 圆形容器 */
    .icon-wrapper {
      width: 90px;
      height: 90px;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.8rem;
      box-shadow: 0 15px 25px -8px rgba(26, 67, 113, 0.4);
      position: relative;
      animation: pulseSoft 2s infinite ease-in-out;
    }

    @keyframes pulseSoft {
      0% { box-shadow: 0 15px 25px -8px rgba(26, 67, 113, 0.4); }
      50% { box-shadow: 0 15px 30px -4px rgba(42, 82, 152, 0.7); }
      100% { box-shadow: 0 15px 25px -8px rgba(26, 67, 113, 0.4); }
    }

    /* SVG 图标本身 */
    .icon-svg {
      width: 44px;
      height: 44px;
      display: block;
      color: white;
    }

    /* 标题 */
    .title {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #0b2b44;
      margin-bottom: 0.75rem;
      line-height: 1.2;
    }

    /* 描述文字 */
    .description {
      font-size: 1.1rem;
      color: #2c4c6e;
      margin-bottom: 2rem;
      line-height: 1.5;
      font-weight: 400;
      padding: 0 0.5rem;
    }

    /* 新链接按钮 — 可点击，核心操作区 */
    .new-link-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      border: none;
      padding: 1.1rem 2.2rem;
      border-radius: 60px;
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 2rem;
      box-shadow: 0 15px 25px -8px rgba(26, 67, 113, 0.5);
      transition: all 0.25s ease;
      word-break: break-all;
      max-width: 100%;
      line-height: 1.4;
      cursor: pointer;
      letter-spacing: 0.01em;
    }

    .new-link-button:hover {
      background: linear-gradient(135deg, #264d8a, #3568bc);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 20px 32px -10px rgba(26, 67, 113, 0.7);
    }

    .new-link-button:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 10px 18px -6px rgba(26, 67, 113, 0.5);
    }

    /* 按钮内的 SVG 箭头 */
    .button-arrow {
      width: 20px;
      height: 20px;
      transition: transform 0.2s ease;
    }

    .new-link-button:hover .button-arrow {
      transform: translateX(4px);
    }

    /* 显示新链接的纯文本提示（便于复制） */
    .link-preview {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: rgba(220, 235, 255, 0.6);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(100, 150, 210, 0.3);
      padding: 0.7rem 1.4rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 400;
      color: #1b4c7c;
      margin-bottom: 1.8rem;
      word-break: break-all;
      max-width: 100%;
      line-height: 1.4;
      font-family: 'Inter', monospace;
    }

    /* 链接预览中的 SVG 链接小图标 */
    .link-icon-svg {
      width: 16px;
      height: 16px;
      color: #2c5a8a;
      flex-shrink: 0;
    }

    .url-text {
      font-family: 'Inter', monospace;
      background: rgba(255, 255, 255, 0.6);
      padding: 0.2rem 0.5rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #0f365a;
      word-break: break-all;
    }

    /* 小提示 */
    .footnote {
      margin-top: 2.3rem;
      font-size: 0.85rem;
      color: #6a8aac;
      border-top: 1px solid rgba(120, 160, 200, 0.25);
      padding-top: 1.3rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    /* 小闪电图标 */
    .bolt-icon {
      width: 14px;
      height: 14px;
      color: #2a6eb0;
    }

    /* 移动端适配 */
    @media (max-width: 480px) {
      .card {
        padding: 2.2rem 1.5rem 2rem;
        border-radius: 2rem;
      }
      .title {
        font-size: 1.6rem;
      }
      .description {
        font-size: 1rem;
        margin-bottom: 1.6rem;
      }
      .icon-wrapper {
        width: 76px;
        height: 76px;
        margin-bottom: 1.5rem;
      }
      .icon-svg {
        width: 38px;
        height: 38px;
      }
      .new-link-button {
        padding: 0.9rem 1.6rem;
        font-size: 1rem;
        gap: 0.5rem;
      }
      .button-arrow {
        width: 18px;
        height: 18px;
      }
      .link-preview {
        padding: 0.6rem 1rem;
        font-size: 0.8rem;
        flex-wrap: wrap;
      }
      .url-text {
        font-size: 0.75rem;
      }
      .footnote {
        font-size: 0.8rem;
        flex-wrap: wrap;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card {
        animation: none;
      }
      .icon-wrapper {
        animation: none;
      }
      .new-link-button:hover {
        transform: none;
      }
      .new-link-button:hover .button-arrow {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- SVG 图标区域 -->
    <div class="icon-wrapper">
      <svg class="icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- 一个精致的“链接失效/刷新”图标：一个断开的链条 + 旋转箭头 -->
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" 
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- 小旋转箭头点缀（表示更新/跳转） -->
        <path d="M17 8l2-2M19 6l2 2M19 6v4M19 6h-4" 
              stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      </svg>
    </div>

    <h1 class="title">链接已失效</h1>
    <p class="description">
      此链接已不再有效或已被移动。<br>
      请点击下方按钮前往新的地址。
    </p>

    <!-- 可点击的新链接按钮 — 手动跳转核心 -->
    <a href="https://yhkj-nb.github.io/QQ.html" class="new-link-button" id="manualJumpBtn">
      <span>前往新链接</span>
      <svg class="button-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>

    <!-- 链接预览，方便用户复制或确认 -->
    <div class="link-preview">
      <svg class="link-icon-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="url-text">https://yhkj-nb.github.io/QQ.html</span>
    </div>

    <div class="footnote">
      <svg class="bolt-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M13 2L3 14h8l-1 8 10-12h-8l1-8z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>新链接安全可用，请放心点击</span>
    </div>
  </div>

  <script>
    // 点击按钮的微反馈（可选增强体验，不影响默认跳转）
    (function() {
      const btn = document.getElementById('manualJumpBtn');
      if (btn) {
        btn.addEventListener('click', function(e) {
          // 不阻止默认行为，让浏览器正常跳转
          this.style.transform = 'scale(0.96)';
          setTimeout(() => {
            this.style.transform = '';
          }, 120);
        });
      }
    })();
  </script>
</body>
</html>
